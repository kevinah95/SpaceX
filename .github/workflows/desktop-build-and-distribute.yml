on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

name: desktop-build-and-distribute

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            artifact_name: dmg
            gradle_task: :desktopApp:packageReleaseDmg
            artifact_glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - runner: windows-latest
            artifact_name: msi
            gradle_task: :desktopApp:packageReleaseMsi
            artifact_glob: desktopApp/build/compose/binaries/main-release/msi/*.msi
          - runner: ubuntu-latest
            artifact_name: deb
            gradle_task: :desktopApp:packageReleaseDeb
            artifact_glob: desktopApp/build/compose/binaries/main-release/deb/*.deb
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
      - name: Build desktop artifact
        shell: bash
        run: ./gradlew ${{ matrix.gradle_task }} --console=plain
      - name: Resolve desktop artifact path
        id: artifact
        shell: bash
        run: |
          shopt -s nullglob
          files=(${{ matrix.artifact_glob }})

          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one desktop artifact for pattern: ${{ matrix.artifact_glob }}" >&2
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload desktop release artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ inputs.release_tag }} ${{ steps.artifact.outputs.path }} --clobber
