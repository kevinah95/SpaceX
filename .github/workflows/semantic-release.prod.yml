on:
  push:
    branches:
      - prod

permissions:
  contents: write
  pull-requests: write

name: semantic-release-prod

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-build-and-distribute:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}
      - name: Build and distribute Android release
        uses: ./.github/actions/android-build-and-distribute
        with:
          release_tag: ${{ needs.semantic-release.outputs.new_release_git_tag }}
          release_notes: ${{ needs.semantic-release.outputs.new_release_notes }}
          build_task: :androidApp:assembleProdRelease
          artifact_path: ./androidApp/build/outputs/apk/prod/release/androidApp-prod-release.apk
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          firebase_credential_file_content: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          firebase_app_id: ${{ secrets.FIREBASE_APP_ID }}

  desktop-build-and-upload:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            gradle_task: :desktopApp:packageReleaseDmg
            artifact_glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - runner: windows-latest
            gradle_task: :desktopApp:packageReleaseMsi
            artifact_glob: desktopApp/build/compose/binaries/main-release/msi/*.msi
          - runner: ubuntu-latest
            gradle_task: :desktopApp:packageReleaseDeb
            artifact_glob: desktopApp/build/compose/binaries/main-release/deb/*.deb
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}
      - name: Build and upload desktop release
        uses: ./.github/actions/desktop-build-and-upload
        with:
          release_tag: ${{ needs.semantic-release.outputs.new_release_git_tag }}
          gradle_task: ${{ matrix.gradle_task }}
          artifact_glob: ${{ matrix.artifact_glob }}
