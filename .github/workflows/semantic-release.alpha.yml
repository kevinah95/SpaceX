on:
  push:
    branches:
      - alpha

permissions:
  contents: write
  pull-requests: write

name: semantic-release-alpha

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  call-build-workflow:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/build-and-distribute.yml
    with:
      release_tag: ${{ needs.semantic-release.outputs.new_release_git_tag }}
      release_notes: ${{ needs.semantic-release.outputs.new_release_notes }}
      build_task: :androidApp:assembleAlphaRelease
      artifact_path: ./androidApp/build/outputs/apk/alpha/release/androidApp-alpha-release.apk
    secrets:
      google-services-json: ${{ secrets.ALPHA_GOOGLE_SERVICES_JSON }}
      keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
      keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
      key-alias: ${{ secrets.KEY_ALIAS }}
      firebase-credential-file-content: ${{ secrets.ALPHA_FIREBASE_CREDENTIAL_FILE_CONTENT }}
      firebase-app-id: ${{ secrets.ALPHA_FIREBASE_APP_ID }}

  call-build-workflow-ios:
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/build-and-distribute-ios.yml
    with:
      release_tag: ${{ needs.semantic-release.outputs.new_release_git_tag }}
      release_notes: ${{ needs.semantic-release.outputs.new_release_notes }}
      artifact_path: ./build/ios/SpaceX-alpha.ipa
    secrets:
      google-service-info-plist: ${{ secrets.ALPHA_GOOGLE_SERVICE_INFO_PLIST }}
      ios-certificate-p12-base64: ${{ secrets.ALPHA_IOS_CERTIFICATE_P12_BASE64 }}
      ios-certificate-p12-password: ${{ secrets.ALPHA_IOS_CERTIFICATE_P12_PASSWORD }}
      ios-provisioning-profile-base64: ${{ secrets.ALPHA_IOS_PROVISIONING_PROFILE_BASE64 }}
      keychain-password: ${{ secrets.ALPHA_IOS_KEYCHAIN_PASSWORD }}
      firebase-credential-file-content: ${{ secrets.ALPHA_FIREBASE_CREDENTIAL_FILE_CONTENT }}
      firebase-app-id: ${{ secrets.ALPHA_FIREBASE_APP_ID }}
